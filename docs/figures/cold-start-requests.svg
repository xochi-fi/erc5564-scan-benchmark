<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Requests to fetch each chain's full history by strategy">
<title>Requests to fetch each chain's full history by strategy</title>
<style>
  .bg { fill: #ffffff; }
  .ink { fill: #1f2328; }
  .muted { fill: #59636e; }
  .grid { stroke: #d1d9e0; }
  .axis { stroke: #818b98; }
  .gap { stroke: #ffffff; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; }
  .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .band { fill: #818b98; fill-opacity: 0.16; }
  .hollow { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #f0f6fc; }
    .muted { fill: #9198a1; }
    .grid { stroke: #2f353d; }
    .axis { stroke: #656c76; }
    .gap { stroke: #0d1117; }
    .s1 { fill: #3987e5; stroke: #3987e5; }
    .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; }
    .band { fill: #9198a1; fill-opacity: 0.18; }
    .hollow { fill: #0d1117; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 600; }
  .label { font-size: 14px; }
  .small { font-size: 13px; }
</style>
<rect class="bg" x="0" y="0" width="760" height="440" rx="6"/>
<text x="20" y="30" class="title ink" text-anchor="start">Requests to fetch each chain's history</text>
<rect x="20" y="47" width="12" height="12" class="s2" rx="2"></rect>
<text x="38" y="58" class="label ink" text-anchor="start">Chainlist order</text>
<rect x="168" y="47" width="12" height="12" class="s1" rx="2"></rect>
<text x="186" y="58" class="label ink" text-anchor="start">Probe-informed</text>
<rect x="308.4" y="47" width="12" height="12" class="s3" rx="2"></rect>
<text x="326.4" y="58" class="label ink" text-anchor="start">Parallel backfill</text>
<rect x="472.6" y="48" width="10" height="10" class="axis" rx="2" fill="none" stroke-width="2"></rect>
<text x="489.6" y="58" class="label ink" text-anchor="start">stopped early</text>
<line x1="120" y1="76" x2="120" y2="384" class="grid"/>
<text x="120" y="404" class="small muted" text-anchor="middle">10</text>
<line x1="270" y1="76" x2="270" y2="384" class="grid"/>
<text x="270" y="404" class="small muted" text-anchor="middle">100</text>
<line x1="420" y1="76" x2="420" y2="384" class="grid"/>
<text x="420" y="404" class="small muted" text-anchor="middle">1k</text>
<line x1="570" y1="76" x2="570" y2="384" class="grid"/>
<text x="570" y="404" class="small muted" text-anchor="middle">10k</text>
<line x1="720" y1="76" x2="720" y2="384" class="grid"/>
<text x="720" y="404" class="small muted" text-anchor="middle">100k</text>
<line x1="120" y1="384" x2="720" y2="384" class="axis"/>
<text x="720" y="424" class="small muted" text-anchor="end">requests, log scale</text>
<text x="110" y="99" class="label ink" text-anchor="end">Ethereum</text>
<rect x="120" y="80" width="317" height="11" class="s2" rx="2"><title>Ethereum, Chainlist order: 1,299 requests, 1,556.2 s, 298 logs</title></rect>
<rect x="120" y="93" width="71.6" height="11" class="s1" rx="2"><title>Ethereum, Probe-informed: 30 requests, 7.6 s, 298 logs</title></rect>
<text x="110" y="149.5" class="label ink" text-anchor="end">Base</text>
<rect x="121" y="125" width="433.5" height="9" class="s2" rx="2" fill-opacity="0.12" stroke-width="2"><title>Base, Chainlist order: 8,000 requests, 2,051.2 s, stopped after 457 logs</title></rect>
<rect x="121" y="138" width="433.5" height="9" class="s1" rx="2" fill-opacity="0.12" stroke-width="2"><title>Base, Probe-informed: 8,000 requests, 2,334.1 s, stopped after 462 logs</title></rect>
<rect x="120" y="150" width="481.8" height="11" class="s3" rx="2"><title>Base, Parallel backfill: 16,296 requests, 1,659.4 s, 679 logs</title></rect>
<text x="110" y="187" class="label ink" text-anchor="end">Arbitrum One</text>
<rect x="120" y="168" width="124.9" height="11" class="s2" rx="2"><title>Arbitrum One, Chainlist order: 68 requests, 16.9 s, 19 logs</title></rect>
<rect x="120" y="181" width="107.4" height="11" class="s1" rx="2"><title>Arbitrum One, Probe-informed: 52 requests, 14.2 s, 19 logs</title></rect>
<text x="110" y="231" class="label ink" text-anchor="end">OP Mainnet</text>
<rect x="120" y="212" width="389.2" height="11" class="s2" rx="2"><title>OP Mainnet, Chainlist order: 3,930 requests, 1,104.9 s, 2 logs</title></rect>
<rect x="120" y="225" width="90.3" height="11" class="s1" rx="2"><title>OP Mainnet, Probe-informed: 40 requests, 10.5 s, 2 logs</title></rect>
<text x="110" y="275" class="label ink" text-anchor="end">Gnosis</text>
<rect x="120" y="256" width="394.5" height="11" class="s2" rx="2"><title>Gnosis, Chainlist order: 4,268 requests, 4,297.1 s, 3 logs</title></rect>
<rect x="120" y="269" width="79.7" height="11" class="s1" rx="2"><title>Gnosis, Probe-informed: 34 requests, 17.0 s, 3 logs</title></rect>
<text x="110" y="319" class="label ink" text-anchor="end">Polygon PoS</text>
<rect x="120" y="300" width="390.7" height="11" class="s2" rx="2"><title>Polygon PoS, Chainlist order: 4,026 requests, 1,034.7 s, 9 logs</title></rect>
<rect x="120" y="313" width="90.3" height="11" class="s1" rx="2"><title>Polygon PoS, Probe-informed: 40 requests, 11.9 s, 9 logs</title></rect>
<text x="110" y="363" class="label ink" text-anchor="end">Sepolia</text>
<rect x="120" y="344" width="135.5" height="11" class="s2" rx="2"><title>Sepolia, Chainlist order: 80 requests, 66.2 s, 1,039 logs</title></rect>
<rect x="120" y="357" width="71.6" height="11" class="s1" rx="2"><title>Sepolia, Probe-informed: 30 requests, 8.0 s, 1,039 logs</title></rect>
</svg>
