<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-label="Requests against logs found per strategy on the pinned Base windows">
<title>Requests against logs found per strategy on the pinned Base windows</title>
<style>
  .bg { fill: #ffffff; }
  .ink { fill: #1f2328; }
  .muted { fill: #59636e; }
  .grid { stroke: #d1d9e0; }
  .axis { stroke: #818b98; }
  .gap { stroke: #ffffff; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; }
  .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .band { fill: #818b98; fill-opacity: 0.16; }
  .hollow { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .ink { fill: #f0f6fc; }
    .muted { fill: #9198a1; }
    .grid { stroke: #2f353d; }
    .axis { stroke: #656c76; }
    .gap { stroke: #0d1117; }
    .s1 { fill: #3987e5; stroke: #3987e5; }
    .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; }
    .band { fill: #9198a1; fill-opacity: 0.18; }
    .hollow { fill: #0d1117; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .title { font-size: 18px; font-weight: 600; }
  .label { font-size: 14px; }
  .small { font-size: 13px; }
</style>
<rect class="bg" x="0" y="0" width="760" height="366" rx="6"/>
<text x="20" y="30" class="title ink" text-anchor="start">Requests vs logs found</text>
<circle cx="26" cy="53" r="6" class="s3"></circle>
<text x="38" y="58" class="label ink" text-anchor="start">two sources agreed</text>
<circle cx="196.8" cy="53" r="5" class="s2 hollow" stroke-width="2.5"></circle>
<text x="208.8" y="58" class="label ink" text-anchor="start">one source</text>
<text x="20" y="90" class="small muted" text-anchor="start">logs found, of 48</text>
<line x1="70" y1="110" x2="70" y2="310" class="grid"/>
<text x="70" y="330" class="small muted" text-anchor="middle">0</text>
<line x1="395" y1="110" x2="395" y2="310" class="grid"/>
<text x="395" y="330" class="small muted" text-anchor="middle">100</text>
<line x1="720" y1="110" x2="720" y2="310" class="grid"/>
<text x="720" y="330" class="small muted" text-anchor="middle">200</text>
<line x1="70" y1="310" x2="720" y2="310" class="grid"/>
<text x="62" y="315" class="small muted" text-anchor="end">0</text>
<line x1="70" y1="110" x2="720" y2="110" class="grid"/>
<text x="62" y="115" class="small muted" text-anchor="end">48</text>
<line x1="70" y1="310" x2="720" y2="310" class="axis"/>
<line x1="70" y1="110" x2="70" y2="310" class="axis"/>
<text x="720" y="350" class="small muted" text-anchor="end">requests</text>
<circle cx="187" cy="110" r="7" class="s3"><title>Two feeds: 48/48, 36 GET, 0.34 s over the network (38.8 ms on loopback)</title></circle>
<text x="187" y="96" class="label ink" text-anchor="middle">Two feeds</text>
<circle cx="297.5" cy="110" r="6" class="s2 hollow" stroke-width="2.5"><title>Tenderly alone: 48/48, 70 POST, 18.82 s paced</title></circle>
<text x="297.5" y="96" class="label ink" text-anchor="middle">Tenderly alone</text>
<circle cx="300.8" cy="110" r="6" class="s2 hollow" stroke-width="2.5"><title>Tenderly alone, Bun client: 48/48, 71 POST, 6.90 s excluding pacing (19.33 s paced)</title></circle>
<circle cx="531.5" cy="110" r="7" class="s3"><title>Tenderly × Sentio: 48/48, 142 POST, 28.76 s paced</title></circle>
<text x="531.5" y="96" class="label ink" text-anchor="middle">Tenderly × Sentio</text>
<circle cx="658.3" cy="110" r="7" class="s3"><title>Daybreak × Tenderly: 48/48, 181 POST, 31.25 s paced</title></circle>
<text x="658.3" y="136" class="label ink" text-anchor="middle">Daybreak × Tenderly</text>
<circle cx="297.5" cy="310" r="6" class="s2 hollow" stroke-width="2.5"><title>Daybreak alone: 0/48, 70 POST, 18.69 s paced</title></circle>
<text x="297.5" y="296" class="label ink" text-anchor="middle">Daybreak alone</text>
</svg>
