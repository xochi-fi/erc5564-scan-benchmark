</style>
<rect class="bg" x="0" y="0" width="760" height="395" rx="6"/>
<text x="20" y="28" class="title ink" text-anchor="start">Requests against logs found, Base, 68 pinned windows: verified completeness is cheap</text>
<rect x="230" y="43" width="10" height="10" class="s3" rx="2"></rect>
<text x="245" y="52" class="label ink" text-anchor="start">two sources agreed</text>
<rect x="373.8" y="43" width="10" height="10" class="s2" rx="2"></rect>
<text x="388.8" y="52" class="label ink" text-anchor="start">single source (hollow)</text>
<line x1="70" y1="70" x2="70" y2="260" class="grid"/>
<text x="70" y="276" class="small muted" text-anchor="middle">0</text>
<line x1="232.5" y1="70" x2="232.5" y2="260" class="grid"/>
<text x="232.5" y="276" class="small muted" text-anchor="middle">50</text>
<line x1="395" y1="70" x2="395" y2="260" class="grid"/>
<text x="395" y="276" class="small muted" text-anchor="middle">100</text>
<line x1="557.5" y1="70" x2="557.5" y2="260" class="grid"/>
<text x="557.5" y="276" class="small muted" text-anchor="middle">150</text>
<line x1="720" y1="70" x2="720" y2="260" class="grid"/>
<text x="720" y="276" class="small muted" text-anchor="middle">200</text>
<line x1="70" y1="260" x2="720" y2="260" class="grid"/>
<text x="62" y="264" class="small muted" text-anchor="end">0</text>
<line x1="70" y1="165" x2="720" y2="165" class="grid"/>
<text x="62" y="169" class="small muted" text-anchor="end">24</text>
<line x1="70" y1="70" x2="720" y2="70" class="grid"/>
<text x="62" y="74" class="small muted" text-anchor="end">48</text>
<line x1="70" y1="260" x2="720" y2="260" class="axis"/>
<line x1="70" y1="70" x2="70" y2="260" class="axis"/>
<text x="720" y="292" class="small muted" text-anchor="end">requests (POST for RPC, GET for feeds)</text>
<text x="20" y="52" class="small muted" text-anchor="start">logs found / 48</text>
<line x1="187" y1="77" x2="187" y2="160" class="axis"/>
<circle cx="187" cy="70" r="6" class="s3"><title>Two static feeds: 48/48, 36 GET, 38.8 ms on loopback, not over the Internet</title></circle>
<text x="195" y="168" class="small ink" text-anchor="start">Two static feeds: 36 GET, 38.8 ms on loopback, not over the Internet</text>
<line x1="297.5" y1="77" x2="297.5" y2="124" class="axis"/>
<circle cx="297.5" cy="70" r="5" class="s2 hollow" stroke-width="2.5"><title>Tenderly alone, browser: 48/48, 70 POST, 18.82 s</title></circle>
<text x="305.5" y="132" class="small ink" text-anchor="start">Tenderly alone, browser: 70 POST, 18.82 s</text>
<line x1="300.8" y1="77" x2="300.8" y2="142" class="axis"/>
<circle cx="300.8" cy="70" r="5" class="s2 hollow" stroke-width="2.5"><title>Tenderly alone, Bun client: 48/48, 71 POST, 19.33 s median</title></circle>
<text x="308.8" y="150" class="small ink" text-anchor="start">Tenderly alone, Bun client: 71 POST, 19.33 s median</text>
<line x1="531.5" y1="77" x2="531.5" y2="88" class="axis"/>
<circle cx="531.5" cy="70" r="6" class="s3"><title>Tenderly × Sentio: 48/48, 142 POST, 28.76 s</title></circle>
<text x="525.5" y="96" class="small ink" text-anchor="end">Tenderly × Sentio: 142 POST, 28.76 s</text>
<line x1="658.3" y1="77" x2="658.3" y2="106" class="axis"/>
<circle cx="658.3" cy="70" r="6" class="s3"><title>Daybreak × Tenderly, Sentio tiebreak: 48/48, 181 POST, 31.25 s</title></circle>
<text x="652.3" y="114" class="small ink" text-anchor="end">Daybreak × Tenderly, Sentio tiebreak: 181 POST, 31.25 s</text>
<line x1="297.5" y1="253" x2="297.5" y2="244" class="axis"/>
<circle cx="297.5" cy="260" r="5" class="s2 hollow" stroke-width="2.5"><title>Daybreak alone: 0/48, 70 POST, 18.69 s</title></circle>
<text x="305.5" y="244" class="small ink" text-anchor="start">Daybreak alone: 70 POST, 18.69 s</text>
<text x="20" y="312" class="small muted" text-anchor="start">All points cover the same 68 windows of 1,000 blocks with 48 known logs. A single source that finds 48 looks the same as</text>
<text x="20" y="327" class="small muted" text-anchor="start">one that finds 0: nothing in the run says which. Feeds ran on loopback; remote hosting adds round trips the time does not</text>
<text x="20" y="342" class="small muted" text-anchor="start">include.</text>
<text x="20" y="357" class="small muted" text-anchor="start">Sources: data/rpc-recovery/summary.json (browser runs), data/shared-feed/summary.json (Bun client and feeds). Details:</text>
<text x="20" y="372" class="small muted" text-anchor="start">docs/rpc-recovery.md, docs/shared-feed.md.</text>
</svg>
