<text x="478" y="344" class="label ink" text-anchor="start">kept</text>
<circle cx="530.4" cy="339" r="5" class="axis hollow" stroke-width="2.5"></circle>
<text x="542.4" y="344" class="label ink" text-anchor="start">reverted</text>
