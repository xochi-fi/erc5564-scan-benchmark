<text x="472.4" y="239" class="small ink" text-anchor="start">55,492</text>
<text x="20" y="298" class="label muted" text-anchor="start">Format search, one source's cold pages per iteration (13 iterations, keep or revert)</text>
<text x="240" y="325" class="small ink" text-anchor="end">0. baseline</text>
<rect x="250" y="316" width="341" height="10" class="s1" rx="2"><title>baseline: 43,719 bytes, baseline</title></rect>
<text x="597" y="325" class="small muted" text-anchor="start">43,719</text>
<text x="240" y="342" class="small ink" text-anchor="end">1. drop 0x prefixes</text>
<rect x="250" y="333" width="336.5" height="10" class="s3" rx="2"><title>drop 0x prefixes: 43,143 bytes, keep</title></rect>
<text x="592.5" y="342" class="small muted" text-anchor="start">43,143</text>
<text x="240" y="359" class="small ink" text-anchor="end">2. base64 hashes and topics</text>
<rect x="250" y="350" width="299.1" height="10" class="s3" rx="2"><title>base64 hashes and topics: 38,343 bytes, keep</title></rect>
<text x="555.1" y="359" class="small muted" text-anchor="start">38,343</text>
<text x="240" y="376" class="small ink" text-anchor="end">3. trim leading zero bytes in topics</text>
<rect x="250" y="367" width="272.1" height="10" class="s3" rx="2"><title>trim leading zero bytes in topics: 34,887 bytes, keep</title></rect>
<text x="528.1" y="376" class="small muted" text-anchor="start">34,887</text>
<text x="240" y="393" class="small ink" text-anchor="end">4. zero-run encode ABI data</text>
<rect x="250" y="384" width="130.7" height="10" class="s3" rx="2"><title>zero-run encode ABI data: 16,753 bytes, keep</title></rect>
<text x="386.7" y="393" class="small muted" text-anchor="start">16,753</text>
<text x="240" y="410" class="small muted" text-anchor="end">5. base64 ABI data</text>
<rect x="250" y="401" width="209.7" height="10" class="muted" rx="2" fill-opacity="0.35"><title>base64 ABI data: 26,883 bytes, discard</title></rect>
<text x="465.7" y="410" class="small muted" text-anchor="start">26,883, reverted</text>
<text x="240" y="427" class="small ink" text-anchor="end">6. 32 windows per page</text>
<rect x="250" y="418" width="120.6" height="10" class="s3" rx="2"><title>32 windows per page: 15,457 bytes, keep</title></rect>
<text x="376.6" y="427" class="small muted" text-anchor="start">15,457</text>
<text x="240" y="444" class="small ink" text-anchor="end">7. drop page id and index from body</text>
<rect x="250" y="435" width="118.6" height="10" class="s3" rx="2"><title>drop page id and index from body: 15,211 bytes, keep</title></rect>
<text x="374.6" y="444" class="small muted" text-anchor="start">15,211</text>
<text x="240" y="461" class="small ink" text-anchor="end">8. single-letter body keys</text>
<rect x="250" y="452" width="118.6" height="10" class="s3" rx="2"><title>single-letter body keys: 15,202 bytes, keep</title></rect>
<text x="374.6" y="461" class="small muted" text-anchor="start">15,202</text>
<text x="240" y="478" class="small ink" text-anchor="end">9. columnar layout</text>
<rect x="250" y="469" width="118.2" height="10" class="s3" rx="2"><title>columnar layout: 15,148 bytes, keep</title></rect>
<text x="374.2" y="478" class="small muted" text-anchor="start">15,148</text>
<text x="240" y="495" class="small ink" text-anchor="end">10. delta-encode block numbers</text>
<rect x="250" y="486" width="116.6" height="10" class="s3" rx="2"><title>delta-encode block numbers: 14,953 bytes, keep</title></rect>
<text x="372.6" y="495" class="small muted" text-anchor="start">14,953</text>
<text x="240" y="512" class="small muted" text-anchor="end">11. per-page block hash table</text>
<rect x="250" y="503" width="117" height="10" class="muted" rx="2" fill-opacity="0.35"><title>per-page block hash table: 14,996 bytes, discard</title></rect>
<text x="373" y="512" class="small muted" text-anchor="start">14,996, reverted</text>
<text x="240" y="529" class="small muted" text-anchor="end">12. 16 windows per page</text>
<rect x="250" y="520" width="116.9" height="10" class="muted" rx="2" fill-opacity="0.35"><title>16 windows per page: 14,993 bytes, discard</title></rect>
<text x="372.9" y="529" class="small muted" text-anchor="start">14,993, reverted</text>
<text x="240" y="546" class="small muted" text-anchor="end">13. row layout with delta blocks</text>
<rect x="250" y="537" width="117.1" height="10" class="muted" rx="2" fill-opacity="0.35"><title>row layout with delta blocks: 15,007 bytes, discard</title></rect>
<text x="373.1" y="546" class="small muted" text-anchor="start">15,007, reverted</text>
<text x="20" y="574" class="small muted" text-anchor="start">Decoded body bytes without headers or framing, median of three samples. Live RPC is Tenderly; feeds are two loopback</text>
<text x="20" y="589" class="small muted" text-anchor="start">origins built from the RPC-recovery captures. The byte-optimized format is the search's best kept params, 65.8% smaller</text>
<text x="20" y="604" class="small muted" text-anchor="start">raw and 23.8% smaller under gzip. RPC gzip was not measured.</text>
<text x="20" y="619" class="small muted" text-anchor="start">Sources: data/shared-feed/summary.json, evidence.json, autoresearch/feed-bytes.jsonl. Details: docs/shared-feed.md.</text>
</svg>
