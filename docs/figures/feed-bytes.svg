<path d="M230.0,384.8 H264.6 V386.6 H299.2 V401.0 H333.8 V411.3 H368.5 V465.7 H403.1 V465.7 H437.7 V469.6 H472.3 V470.4 H506.9 V470.4 H541.5 V470.6 H576.2 V471.1 H610.8 V471.1 H645.4 V471.1 H680.0 V471.1" class="s3" style="fill: none" stroke-width="2"/>
<circle cx="230" cy="384.8" r="5" class="s1"><title>0. baseline: 43,719 bytes, baseline</title></circle>
<circle cx="264.6" cy="386.6" r="5" class="s3"><title>1. drop 0x prefixes: 43,143 bytes, keep</title></circle>
<circle cx="299.2" cy="401" r="5" class="s3"><title>2. base64 hashes and topics: 38,343 bytes, keep</title></circle>
<circle cx="333.8" cy="411.3" r="5" class="s3"><title>3. trim leading zero bytes in topics: 34,887 bytes, keep</title></circle>
<circle cx="368.5" cy="465.7" r="5" class="s3"><title>4. zero-run encode ABI data: 16,753 bytes, keep</title></circle>
<circle cx="403.1" cy="435.4" r="4.5" class="axis hollow" stroke-width="2"><title>5. base64 ABI data: 26,883 bytes, discard</title></circle>
<circle cx="437.7" cy="469.6" r="5" class="s3"><title>6. 32 windows per page: 15,457 bytes, keep</title></circle>
<circle cx="472.3" cy="470.4" r="5" class="s3"><title>7. drop page id and index from body: 15,211 bytes, keep</title></circle>
<circle cx="506.9" cy="470.4" r="5" class="s3"><title>8. single-letter body keys: 15,202 bytes, keep</title></circle>
<circle cx="541.5" cy="470.6" r="5" class="s3"><title>9. columnar layout: 15,148 bytes, keep</title></circle>
<circle cx="576.2" cy="471.1" r="5" class="s3"><title>10. delta-encode block numbers: 14,953 bytes, keep</title></circle>
<circle cx="610.8" cy="471" r="4.5" class="axis hollow" stroke-width="2"><title>11. per-page block hash table: 14,996 bytes, discard</title></circle>
<circle cx="645.4" cy="471" r="4.5" class="axis hollow" stroke-width="2"><title>12. 16 windows per page: 14,993 bytes, discard</title></circle>
<circle cx="680" cy="471" r="4.5" class="axis hollow" stroke-width="2"><title>13. row layout with delta blocks: 15,007 bytes, discard</title></circle>
<text x="240" y="374.8" class="label ink" text-anchor="start">baseline 44k</text>
<text x="576.2" y="497.1" class="label ink" text-anchor="middle">best 15k</text>
