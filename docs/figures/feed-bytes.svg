<rect x="250" y="191" width="31.4" height="5" class="muted"><title>One feed, cold pages, byte-optimized, gzip: 8,043 bytes</title></rect>
<text x="314.3" y="187" class="small ink" text-anchor="start">14,953 (gzip 8,043)</text>
<text x="240" y="213" class="label ink" text-anchor="end">Live RPC, all warm replies</text>
<rect x="250" y="202" width="230" height="14" class="s2" rx="2"><title>Live RPC, all warm replies: 58,987 bytes</title></rect>
<text x="486" y="213" class="small ink" text-anchor="start">58,987</text>
<text x="240" y="239" class="label ink" text-anchor="end">Two feeds plus manifests, warm</text>
