<text x="640" y="268" class="small muted" text-anchor="middle">100k</text>
<text x="240" y="83" class="label ink" text-anchor="end">Live RPC, all cold replies</text>
<rect x="250" y="72" width="324.3" height="14" class="s2" rx="2"><title>Live RPC, all cold replies: 83,147 bytes</title></rect>
<text x="580.3" y="83" class="small ink" text-anchor="start">83,147</text>
