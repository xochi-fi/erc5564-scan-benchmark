<text x="20" y="674" class="small muted" text-anchor="start">65 of 87 rechecked endpoints on 7 chains returned every known log; the rest errored on at least one check or, as above, answered [] without an error.</text>
<text x="20" y="704" class="small muted" text-anchor="start">Filled dot: accepted only what two sources agreed on. Hollow: one source, so a complete result cannot be told apart from a silent</text>
<text x="20" y="719" class="small muted" text-anchor="start">omission. The runs that miss logs end without an error; only scoring against the frozen reference shows the misses.</text>
<text x="20" y="734" class="small muted" text-anchor="start">Sources: data/rpc-recovery/summary.json, data/shared-feed/summary.json and evidence.json, data/chain-volume/consistency/*.json. Details:</text>
<text x="20" y="749" class="small muted" text-anchor="start">docs/rpc-recovery.md, docs/shared-feed.md, docs/chain-volume.md.</text>
