<text x="588.8" y="84" class="small muted" text-anchor="end">A76 2.9 min CPU/day</text>
<circle cx="659.4" cy="118.6" r="3.5" class="s2"><title>1M/day on the A76: 29 min CPU</title></circle>
<text x="651.4" y="122.6" class="small ink" text-anchor="end">1M/day: 29 min</text>
<rect x="127.9" y="346" width="148.7" height="12" class="band" rx="3"></rect>
<rect x="244.5" y="345" width="3" height="14" class="muted"><title>Ethereum: 0.398 announcements/day</title></rect>
<rect x="263.3" y="345" width="3" height="14" class="muted"><title>Base: 0.779 announcements/day</title></rect>
<rect x="195" y="345" width="3" height="14" class="muted"><title>Arbitrum One: 0.068 announcements/day</title></rect>
<rect x="152.8" y="345" width="3" height="14" class="muted"><title>OP Mainnet: 0.015 announcements/day</title></rect>
<rect x="126.4" y="345" width="3" height="14" class="muted"><title>Gnosis: 0.006 announcements/day</title></rect>
<rect x="181.3" y="345" width="3" height="14" class="muted"><title>Polygon PoS: 0.042 announcements/day</title></rect>
<rect x="275.1" y="345" width="3" height="14" class="muted"><title>Sepolia: 1.187 announcements/day</title></rect>
<text x="72" y="356" class="small ink" text-anchor="end">ERC-5564</text>
<text x="284.6" y="356" class="small muted" text-anchor="start">0.006–1.2 per day per chain; A76 CPU at the busiest: 2.1 ms/day</text>
<text x="20" y="386" class="small muted" text-anchor="start">Lines: scan-cost 100k controls, crypto engine, per announcement, scaled linearly. Rug: each chain's canonical Announcer</text>
<text x="20" y="401" class="small muted" text-anchor="start">rate, first announcement to 2026-11-26.</text>
<text x="20" y="416" class="small muted" text-anchor="start">Dashed lines are literature values, not measured here: detector runtime per scanned message, amortized over N = 2^19, for</text>
<text x="20" y="431" class="small muted" text-anchor="start">one recipient's digest; eprint 2024/510 Table 1, GCP n4-standard-8 with AVX512 (HEXL), 1 thread. The flat line is</text>
<text x="20" y="446" class="small muted" text-anchor="start">DoS-PerfOMR's recipient runtime from the same table. The ~12/day crossover compares that recipient runtime with the A76</text>
<text x="20" y="461" class="small muted" text-anchor="start">scan-cost rate. The ~100k/day budget is an assumption, not derived from OMR. Lines compare a cloud x86 core with AVX512 to</text>
<text x="20" y="476" class="small muted" text-anchor="start">one A76 core.</text>
<text x="20" y="491" class="small muted" text-anchor="start">Sources: data/scan-cost/results.csv, data/chain-volume/canonical/retrieve-*.json. Details: docs/paged-discovery.md (prior</text>
<text x="20" y="506" class="small muted" text-anchor="start">work), docs/scan-cost.md.</text>
</svg>
